[package]
name = "alverchat-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
alver-core = { path = "../../../crates/alver-core" }
rand_core.workspace = true
mdns-sd.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
futures-util.workspace = true
ed25519-dalek.workspace = true
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
chrono = "0.4"
if-addrs = "0.15"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3.6.3"
default-features = false
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3.6.3"
default-features = false
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3.6.3"
default-features = false
features = ["linux-native-sync-persistent", "crypto-rust", "vendored"]

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
