[workspace]
resolver = "2"
members = ["crates/alver-core", "crates/alver-platform", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
tracing = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
mdns-sd = "0.21"
snow = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
x509-parser = "0.18"
futures-util = "0.3"
proptest = "1.12.0"
